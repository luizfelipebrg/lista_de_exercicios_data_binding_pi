<label>Produto:</label><br>
<input type="text" [(ngModel)]="produto"><br><br>

<label>Preço:</label><br>
<input type="number" [(ngModel)]="preco"><br><br>

<label>Quantidade:</label><br>
<input type="number" [(ngModel)]="quantidade"><br>

<p>Produto: {{produto}}</p>
<p>Preço: {{preco | currency:'BRL'}}</p>
<p>Quantidade: {{quantidade}}</p>
<p>Total: {{preco * quantidade | currency:'BRL'}}</p>
