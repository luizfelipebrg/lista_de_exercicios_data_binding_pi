<h2>Sintaxe moderna</h2>

<p>
  &#64;if e &#64;for são blocos de controle de fluxo do template; *ngIf e *ngFor são diretivas estruturais importadas pelo módulo.
</p>

<p>
  &#64;for exige uma expressão track e permite tratar listas vazias com &#64;empty; com *ngFor, a identificação é opcional e o estado vazio precisa de outra condição.
</p>
