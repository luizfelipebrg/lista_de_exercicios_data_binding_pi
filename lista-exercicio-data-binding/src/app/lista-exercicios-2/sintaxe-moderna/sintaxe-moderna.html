<h2>Sintaxe moderna</h2>

<p>
  &#64;if e &#64;else permitem declarar as duas condições no mesmo bloco; com *ngIf, a alternativa é definida em um ng-template.
</p>

<p>
  &#64;for exige track e permite tratar listas vazias com &#64;empty; *ngFor não exige identificador e precisa de outra condição para lista vazia.
</p>
